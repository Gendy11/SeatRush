services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: seatrush
      POSTGRES_PASSWORD: seatrush
      POSTGRES_DB: seatrush
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatrush"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
